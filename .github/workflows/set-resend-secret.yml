name: Set RESEND_KEY secret on all CF Workers
on:
  workflow_dispatch:

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Push RESEND_KEY to all Cloudflare Workers
        run: |
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/iptv-trial-flimmerkanal/secrets" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"RESEND_KEY","text":"${{ secrets.RESEND_KEY_VALUE }}","type":"secret_text"}' && echo "OK: iptv-trial-flimmerkanal" || echo "FAIL: iptv-trial-flimmerkanal"
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/iptv-trial-mojo4ktv/secrets" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"RESEND_KEY","text":"${{ secrets.RESEND_KEY_VALUE }}","type":"secret_text"}' && echo "OK: iptv-trial-mojo4ktv" || echo "FAIL: iptv-trial-mojo4ktv"
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/iptv-trial-iptvmojo/secrets" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"RESEND_KEY","text":"${{ secrets.RESEND_KEY_VALUE }}","type":"secret_text"}' && echo "OK: iptv-trial-iptvmojo" || echo "FAIL: iptv-trial-iptvmojo"
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/iptv-trial-buyiptvnorway/secrets" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
