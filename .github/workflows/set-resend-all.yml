name: Set per-site RESEND_KEY on all CF Workers
on:
  workflow_dispatch:

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Push RESEND_KEY to each Cloudflare Worker
        run: |
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/iptv-trial-streamdeutschland/secrets" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"RESEND_KEY","text":"${{ secrets.RKEY_STREAMDE }}","type":"secret_text"}' \
            && echo "OK: iptv-trial-streamdeutschland" || echo "FAIL: iptv-trial-streamdeutschland"
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/iptv-trial-flimmerkanal/secrets" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"RESEND_KEY","text":"${{ secrets.RKEY_FLIMMER }}","type":"secret_text"}' \
            && echo "OK: iptv-trial-flimmerkanal" || echo "FAIL: iptv-trial-flimmerkanal"
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/iptv-trial-iptvvde/secrets" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"RESEND_KEY","text":"${{ secrets.RKEY_IPTVVDE }}","type":"secret_text"}' \
            && echo "OK: iptv-trial-iptvvde" || echo "FAIL: iptv-trial-iptvvde"
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/iptv-trial-mojo4kfr/secrets" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"RESEND_KEY","text":"${{ secrets.RKEY_MOJO4KFR }}","type":"secret_text"}' \
            && echo "OK: iptv-trial-mojo4kfr" || echo "FAIL: iptv-trial-mojo4kfr"
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/iptv-trial-mojo4kde/secrets" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"RESEND_KEY","text":"${{ secrets.RKEY_MOJO4KDE }}","type":"secret_text"}' \
            && echo "OK: iptv-trial-mojo4kde" || echo "FAIL: iptv-trial-mojo4kde"
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/iptv-trial-norgesiptv/secrets" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"RESEND_KEY","text":"${{ secrets.RKEY_NORGES }}","type":"secret_text"}' \
            && echo "OK: iptv-trial-norgesiptv" || echo "FAIL: iptv-trial-norgesiptv"
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/iptv-trial-buyiptvnorway/secrets" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"RESEND_KEY","text":"${{ secrets.RKEY_BUYNORWAY }}","type":"secret_text"}' \
            && echo "OK: iptv-trial-buyiptvnorway" || echo "FAIL: iptv-trial-buyiptvnorway"
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/iptv-trial-maplestreamtv/secrets" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"RESEND_KEY","text":"${{ secrets.RKEY_MAPLESTREAM }}","type":"secret_text"}' \
            && echo "OK: iptv-trial-maplestreamtv" || echo "FAIL: iptv-trial-maplestreamtv"
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/iptv-trial-maple4k/secrets" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"RESEND_KEY","text":"${{ secrets.RKEY_MAPLE4K }}","type":"secret_text"}' \
            && echo "OK: iptv-trial-maple4k" || echo "FAIL: iptv-trial-maple4k"
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/iptv-trial-maplehd/secrets" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"RESEND_KEY","text":"${{ secrets.RKEY_MAPLEHD }}","type":"secret_text"}' \
            && echo "OK: iptv-trial-maplehd" || echo "FAIL: iptv-trial-maplehd"
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/iptv-trial-streambleu/secrets" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"RESEND_KEY","text":"${{ secrets.RKEY_STREAMBLEU }}","type":"secret_text"}' \
            && echo "OK: iptv-trial-streambleu" || echo "FAIL: iptv-trial-streambleu"
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/iptv-trial-iptvmojo/secrets" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"RESEND_KEY","text":"${{ secrets.RKEY_IPTVMOJO }}","type":"secret_text"}' \
            && echo "OK: iptv-trial-iptvmojo" || echo "FAIL: iptv-trial-iptvmojo"
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/iptv-trial-mojo4ktv/secrets" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"RESEND_KEY","text":"${{ secrets.RKEY_MOJO4KTV }}","type":"secret_text"}' \
            && echo "OK: iptv-trial-mojo4ktv" || echo "FAIL: iptv-trial-mojo4ktv"
