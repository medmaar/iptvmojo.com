name: Set RESEND_KEY on all CF Workers
on:
  workflow_dispatch:

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Set iptv-trial-streamdeutschland
        run: |
          RESP=$(curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_V2 }}/workers/scripts/iptv-trial-streamdeutschland/secrets" \
            -H "Authorization: Bearer ${{ secrets.CF_TOKEN_V2 }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"RESEND_KEY","text":"${{ secrets.RK_STREAMDEUTSC }}","type":"secret_text"}')
          echo "$RESP"
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); exit(0) if d.get('success') else (print('FAIL:',d) or exit(1))" \
            && echo "✅ iptv-trial-streamdeutschland" || (echo "❌ iptv-trial-streamdeutschland" && exit 1)
